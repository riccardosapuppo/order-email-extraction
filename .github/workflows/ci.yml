name: build and check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A job that hangs is worse than one that fails: it stays amber for six
    # hours and nobody looks at it, while a red one sends an email. Learned
    # from a Windows job that sat in_progress for two hours after every one
    # of its checks had passed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The minimum the README claims, so the claim is tested rather than
      # asserted. Raising it here without raising it there is the drift this
      # job exists to catch.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - run: npm ci

      - name: Build every workspace
        run: npm run build

      - name: The rules, the parser, the joining, and what the interface is told
        run: npm test

      # The check that is not written behind the same door as the code: it reads
      # the real .eml files rather than calling the functions with invented
      # arguments. Five defects came out of it that the suite could not see.
      - name: Read the real mailbox
        run: npm run extract

      - name: The header mark and the tab icon are one drawing
        run: npm run check:mark

      # The third layer, and until now it had never run anywhere.
      #
      # The README lists `npm run check:screen` among the checks, and it was the
      # only one this job did not run: it drives a browser, it was written
      # against the Edge that is on a desk, and there is no Edge here. So it
      # passed on one machine, on the days somebody remembered, and a check
      # nobody runs defends nothing.
      #
      # It stays out of the dependencies -- the README promises Node and
      # nothing else, and `npm install` fetching 300 MB of browser would make
      # that false for everybody who only wants to run the thing. Here the
      # runner installs one, uses it, and is thrown away.
      - name: Get a browser to drive
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Follow a value back to its words, through the screen
        # Empty means the browser Playwright brought, rather than the Edge this
        # repository expects on a desk. Empty and unset are not the same thing.
        env:
          PLAYWRIGHT_CHANNEL: ""
        run: npm run check:screen

      # Nothing here should reach the network, and a dependency that starts to
      # is worth knowing about. Not a security control — an assertion about what
      # this is.
      - name: No runtime dependency beyond Express
        run: |
          echo "The server's dependencies:"
          node -e "const p=require('./packages/server/package.json'); console.log(Object.keys(p.dependencies ?? {}).join(', ') || '(none)')"
