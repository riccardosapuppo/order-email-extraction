<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The same mark as app/shell/logo.component.ts: a piece of text, selected.
    Kept as one file rather than exported to PNG so the tab icon and the header
    cannot drift apart.

    The colours are literal here and not custom properties: a favicon is loaded
    outside the page and inherits nothing from it. When the mark changes in the
    component it changes here too, and a check compares the two.
  -->
  <rect width="32" height="32" rx="7" fill="#14181d"/>
  <rect x="7" y="13.5" width="18" height="5" rx="2.5" fill="#ffd24a"/>
  <circle cx="7" cy="9.5" r="2.4" fill="#ffd24a"/>
  <circle cx="25" cy="22.5" r="2.4" fill="#ffd24a"/>
</svg>
